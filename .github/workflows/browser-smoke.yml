name: Browser UI and conversion smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Confirm offline mobile HTML is in sync with desktop engine
        run: node tools/build_mobile.cjs --check
      - name: Test desktop and both mobile flows
        run: node tests/browser-smoke.cjs
      - name: Verify single HTML downloads render and save correctly
        run: node tests/download-page.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-desktop-mobile-preview
          path: tests/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
